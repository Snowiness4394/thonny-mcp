[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thonny-mcp"
version = "0.1.2"
description = "MCP server for executing Python via Thonny's isolated environment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Community", email = "community@example.com"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "thonny",
    "python",
    "windows",
    "data-analysis",
    "ai-agents"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[project.scripts]
thonny-mcp = "thonny_mcp.server:mcp.run"

[project.urls]
Homepage = "https://github.com/Snowiness4394/thonny-mcp"
Documentation = "https://github.com/Snowiness4394/thonny-mcp#readme"
Repository = "https://github.com/Snowiness4394/thonny-mcp"
Issues = "https://github.com/Snowiness4394/thonny-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["thonny_mcp"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "W"]
ignore = ["E501"]
